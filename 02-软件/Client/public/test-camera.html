<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>豆包拍照测试</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: sans-serif; background: #111; color: #fff; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
h1 { font-size: 18px; color: #aaa; }
.btn { padding: 16px 48px; border-radius: 50px; border: none; font-size: 18px; cursor: pointer; }
.btn-camera { background: #FF0000; color: #fff; }
.result { background: #222; border-radius: 12px; padding: 20px; min-width: 280px; text-align: center; }
.result .code { font-size: 28px; font-weight: bold; color: #0f0; word-break: break-all; }
.result .error { font-size: 16px; color: #f66; }
.result .info { font-size: 13px; color: #888; margin-top: 8px; }
.preview { max-width: 300px; max-height: 300px; border-radius: 8px; display: none; }
input[type=file] { display: none; }
</style>
</head>
<body>
<h1>📷 豆包 API 拍照测试</h1>
<button class="btn btn-camera" id="btnCamera" onclick="takePhoto()">拍照识别</button>
<img class="preview" id="preview">
<div class="result" id="result" style="display:none">
  <div class="info" id="step">等待拍照...</div>
  <div class="code" id="code"></div>
  <div class="error" id="error"></div>
</div>
<input type="file" id="cameraInput" accept="image/*" capture="environment">

<script>
const DOUBAO_KEY = 'YOUR_ARK_API_KEY';
const DOUBAO_URL = 'https://ark.cn-beijing.volces.com/api/v3/responses';
const PROMPT = '识别游戏王卡牌编号：前缀为2-4位字母数字，中间横杠分隔，搭配JP等两位语种代码，后缀为字母+数字组合，只提取该格式编号，忽略卡牌所有文字、效果、杂码。拍摄对焦卡牌底部小字，画面清晰无遮挡，仅输出识别出的编号，不要任何多余内容。如QCAC-JP001';

const resultDiv = document.getElementById('result');
const stepDiv = document.getElementById('step');
const codeDiv = document.getElementById('code');
const errorDiv = document.getElementById('error');
const previewImg = document.getElementById('preview');
const cameraInput = document.getElementById('cameraInput');

function log(step, msg) {
  resultDiv.style.display = 'block';
  stepDiv.textContent = step;
  codeDiv.textContent = '';
  errorDiv.textContent = '';
  console.log('[' + new Date().toISOString() + '] ' + step + ': ' + msg);
}

function showResult(code) {
  codeDiv.textContent = code;
  stepDiv.textContent = '✅ 识别完成';
}

function showError(err) {
  errorDiv.textContent = '❌ ' + err;
  stepDiv.textContent = '失败';
}

async function takePhoto() {
  cameraInput.click();
}

cameraInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const t0 = Date.now();
  log('📸 拍照完成', file.name + ' ' + (file.size/1024).toFixed(1) + 'KB');

  // 预览
  const reader = new FileReader();
  reader.onload = (ev) => { previewImg.src = ev.target.result; previewImg.style.display = 'block'; };
  reader.readAsDataURL(file);

  try {
    // 1. 压缩
    log('🔄 压缩中…', '');
    const compressed = await compress(file);
    log('✅ 压缩完成', (compressed.length/1024).toFixed(1) + 'KB (原 ' + (file.size/1024).toFixed(1) + 'KB)');

    // 2. 转 base64
    const base64 = compressed.split(',')[1];
    log('📤 发送豆包…', 'base64长度=' + base64.length);

    // 3. 调豆包
    const resp = await fetch(DOUBAO_URL, {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + DOUBAO_KEY,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        model: 'doubao-seed-2-0-pro-260215',
        input: [{ role: 'user', content: [
          { type: 'input_image', image_url: 'data:image/jpeg;base64,' + base64 },
          { type: 'input_text', text: PROMPT }
        ]}]
      })
    });

    if (!resp.ok) {
      const errText = await resp.text();
      showError('HTTP ' + resp.status + ': ' + errText.substring(0, 200));
      return;
    }

    const data = await resp.json();
    log('📥 豆包返回', JSON.stringify(data).substring(0, 200));

    // 4. 提取编号
    let content = '';
    const output = data?.output;
    if (Array.isArray(output)) {
      for (const item of output) {
        if (item.type === 'message' && item.content) {
          for (const c of item.content) {
            if (c.type === 'output_text' && c.text) content += c.text;
          }
        }
      }
    }
    const code = content.trim().replace(/[\n\r]/g, '');
    const elapsed = Date.now() - t0;
    if (code) {
      showResult(code + ' (' + elapsed + 'ms)');
    } else {
      showError('未识别到编号，原始返回: ' + content.substring(0, 100) + ' (' + elapsed + 'ms)');
    }
  } catch (err) {
    showError(err.message);
  }
});

function compress(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const maxW = 1024, maxH = 1024;
      let w = img.width, h = img.height;
      if (w > maxW || h > maxH) {
        const r = Math.min(maxW/w, maxH/h);
        w = Math.round(w*r); h = Math.round(h*r);
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', 0.7));
    };
    img.onerror = () => reject(new Error('图片加载失败'));
    img.src = URL.createObjectURL(file);
  });
}
</script>
</body>
</html>
